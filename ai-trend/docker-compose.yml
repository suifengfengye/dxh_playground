services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ${SQLITE_DATA_DIR:-/data/ai-trend}:/data/ai-trend

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - api
